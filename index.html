<html lang="en">

  body {
    background: #0a0c12;
    color: #e0e0e0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 28px 32px 24px;
  }

  /* ── HEADER ─────────────────────────────────────── */
  .hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .hdr-left { display: flex; align-items: center; gap: 18px; }
  .trophy { font-size: 38px; line-height: 1; }
  .hdr-title { font-size: 26px; font-weight: 600; color: #f5f5f5; letter-spacing: -0.3px; }
  .hdr-sub { font-size: 12px; color: #666; margin-top: 3px; }
  .nz-pill {
    display: inline-block;
    background: #0a2e16;
    border: 1px solid #2daa55;
    color: #3ddb6a;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    margin-left: 10px;
    vertical-align: middle;
  }

  /* ── WEEK NAVIGATOR ─────────────────────────────── */
  .nav {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #13161f;
    border: 1px solid #22263a;
    border-radius: 10px;
    padding: 8px 16px;
  }
  .nav button {
    background: transparent;
    border: 1px solid #2a2d3a;
    border-radius: 6px;
    color: #aaa;
    font-size: 16px;
    width: 32px; height: 32px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .nav button:hover { background: #1e2130; color: #fff; }
  .nav button:disabled { opacity: 0.25; cursor: default; }
  .nav-label { font-size: 14px; font-weight: 500; color: #ccc; min-width: 200px; text-align: center; }
  .nav-dots { display: flex; gap: 5px; margin-left: 4px; }
  .nav-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2a2d3a; cursor: pointer; transition: background 0.15s;
  }
  .nav-dot.active { background: #e6b830; }

  /* ── STAGE BADGE ─────────────────────────────────── */
  .stage-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 6px;
    margin-bottom: 14px;
    letter-spacing: 0.02em;
  }
  .s-gs  { background: #0d2233; color: #5bc4f5; border: 1px solid #1a4a6a; }
  .s-r32 { background: #0d2b18; color: #5be89a; border: 1px solid #1a5a35; }
  .s-r16 { background: #2b1f00; color: #f5c842; border: 1px solid #5a4000; }
  .s-qf  { background: #2b1000; color: #f58c42; border: 1px solid #5a2800; }
  .s-sf  { background: #1a1040; color: #a894f5; border: 1px solid #3a2880; }
  .s-fin { background: #2a1800; color: #f5c842; border: 1px solid #6a4000; }

  /* ── DAY GRID ────────────────────────────────────── */
  .grid {
    display: grid;
    gap: 10px;
  }
  .grid-7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

  .day-col {
    background: #13161f;
    border: 1px solid #1e2130;
    border-radius: 10px;
    padding: 12px 10px 14px;
    min-height: 120px;
  }
  .day-col.today { border-color: #e6b830; box-shadow: 0 0 0 1px #e6b83040; }

  .day-name {
    font-size: 9px;
    font-weight: 600;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 2px;
  }
  .day-date {
    font-size: 15px;
    font-weight: 500;
    color: #bbb;
    margin-bottom: 10px;
  }
  .today .day-date { color: #e6b830; }
  .rest { font-size: 11px; color: #2a2d3a; font-style: italic; }

  /* ── MATCH CARD ──────────────────────────────────── */
  .match {
    border-left: 2px solid #378ADD;
    padding: 5px 0 5px 8px;
    margin-bottom: 8px;
    border-radius: 0 4px 4px 0;
  }
  .match.grp  { border-left-color: #378ADD; }
  .match.r32  { border-left-color: #3db87a; }
  .match.r16  { border-left-color: #e6b830; }
  .match.qf   { border-left-color: #e06830; }
  .match.sf   { border-left-color: #9b82e8; }
  .match.fin  { border-left-color: #e0a030; background: #1a1000; border-radius: 0 6px 6px 0; }
  .match.nz   { border-left: 2px solid #3ddb6a; background: #061a0d; border-radius: 0 6px 6px 0; }

  .grp-lbl { font-size: 9px; color: #444; margin-bottom: 3px; }
  .team-row { display: flex; align-items: center; gap: 5px; line-height: 1.6; }
  .team-flag { font-size: 15px; line-height: 1; }
  .team-name { font-size: 11px; color: #ccc; }
  .team-row.nz-team .team-name { color: #3ddb6a; font-weight: 600; }
  .vs-divider { font-size: 9px; color: #333; padding-left: 20px; line-height: 1; }
  .match-meta {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 4px;
    font-size: 10px; color: #4a6a7a;
  }
  .match-meta .time { color: #5a7a8a; }
  .match-meta .venue { color: #3d6080; }
  .tbc-label { font-size: 10px; color: #333; font-style: italic; }
  .final-label { font-size: 13px; font-weight: 600; color: #e6b830; }

  /* ── LEGEND ──────────────────────────────────────── */
  .legend {
    display: flex; flex-wrap: wrap; gap: 14px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid #1a1e2a;
  }
  .leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #555; }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── AUTO TICKER ─────────────────────────────────── */
  .ticker {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #0d1018;
    border-top: 1px solid #1e2130;
    padding: 8px 32px;
    font-size: 12px; color: #555;
    display: flex; align-items: center; justify-content: space-between;
  }
  .ticker-nz { color: #3ddb6a; font-weight: 500; }
</style>
</head>

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentWeek = 0;

function getTodayISO() {
  // NZST is UTC+12
  const now = new Date();
  const nzOffset = 12 * 60;
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  const nzTime = new Date(utc + nzOffset * 60000);
  const y = nzTime.getFullYear();
  const m = String(nzTime.getMonth()+1).padStart(2,'0');
  const d = String(nzTime.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function getAutoWeek() {
  const today = getTodayISO();
  let best = 0;
  for (let i = 0; i < WEEKS.length; i++) {
    const w = WEEKS[i];
    const days = w.days.map(d => d.iso);
    if (days.includes(today)) return i;
    if (w.startDate <= today) best = i;
  }
  return best;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderMatch(m) {
  if (m.final) {
    return `<div class="match fin">
      <div class="grp-lbl">${m.grp}</div>
      <div class="final-label">🏆 To be confirmed</div>
      <div class="match-meta">
        <span class="time">⏰ ${m.time} NZST</span>
        <span class="venue">📍 ${m.venue}</span>
      </div>
    </div>`;
  }
  if (m.tbc) {
    return `<div class="match ${m.cls}">
      <div class="grp-lbl">${m.grp}</div>
      <div class="tbc-label">Teams to be confirmed</div>
      ${m.time ? `<div class="match-meta"><span class="time">⏰ ${m.time} NZST</span>${m.venue && m.venue !== 'TBC' ? `<span class="venue">📍 ${m.venue}</span>` : ''}</div>` : ''}
    </div>`;
  }
  const [f1, n1] = m.teams[0];
  const [f2, n2] = m.teams[1];
  const isNZ = m.nz || false;
  const nz1 = n1 === "New Zealand";
  const nz2 = n2 === "New Zealand";
  return `<div class="match ${isNZ ? 'nz' : m.cls}">
    <div class="grp-lbl">${m.grp}</div>
    <div class="team-row ${nz1 ? 'nz-team' : ''}">
      <span class="team-flag">${f1}</span>
      <span class="team-name">${n1}</span>
    </div>
    <div class="vs-divider">vs</div>
    <div class="team-row ${nz2 ? 'nz-team' : ''}">
      <span class="team-flag">${f2}</span>
      <span class="team-name">${n2}</span>
    </div>
    <div class="match-meta">
      <span class="time">⏰ ${m.time} NZST</span>
      <span class="venue">📍 ${m.venue}</span>
    </div>
  </div>`;
}

function render() {
  const w = WEEKS[currentWeek];
  const today = getTodayISO();

  // Nav label & dots
  document.getElementById('nav-label').textContent = w.label;
  document.getElementById('btn-prev').disabled = currentWeek === 0;
  document.getElementById('btn-next').disabled = currentWeek === WEEKS.length - 1;
  const dotsEl = document.getElementById('nav-dots');
  dotsEl.innerHTML = WEEKS.map((_,i) =>
    `<div class="nav-dot ${i===currentWeek?'active':''}" onclick="jumpWeek(${i})" title="${WEEKS[i].label}"></div>`
  ).join('');

  const gridCls = w.cols === 7 ? 'grid-7' : 'grid-4';
  let html = `<span class="stage-badge ${w.stageCls}">${w.stageLbl}</span>`;
  html += `<div class="grid ${gridCls}">`;

  for (const day of w.days) {
    const isToday = day.iso === today;
    html += `<div class="day-col ${isToday ? 'today' : ''}">`;
    html += `<div class="day-name">${day.name}${isToday ? ' · today' : ''}</div>`;
    html += `<div class="day-date">${day.date}</div>`;
    if (!day.matches.length) {
      html += `<div class="rest">Rest day</div>`;
    }
    for (const m of day.matches) html += renderMatch(m);
    html += `</div>`;
  }
  html += `</div>`;
  document.getElementById('content').innerHTML = html;

  // Ticker – next NZ match
  const nzMatches = [];
  for (const wk of WEEKS) {
    for (const day of wk.days) {
      for (const m of day.matches) {
        if (m.nz) nzMatches.push({ date: day.date, time: m.time, teams: m.teams });
      }
    }
  }
  const upcoming = nzMatches.filter((m,i) => {
    const d = WEEKS.flatMap(w => w.days).find(d => d.matches.some(mm => mm === m || (mm.nz && mm.teams === m.teams)));
    return true;
  });
  if (nzMatches.length) {
    const next = nzMatches[0];
    const n1 = next.teams[0][1], n2 = next.teams[1][1];
    document.getElementById('ticker-nz').textContent = `🇳🇿 Next NZ match: ${n1} vs ${n2} · ${nzMatches[0] ? WEEKS.flatMap(w=>w.days).find(d=>d.matches.some(m=>m.nz&&m.teams===next.teams))?.date || '' : ''} · ${next.time} NZST`;
  }
}

function changeWeek(d) {
  currentWeek = Math.max(0, Math.min(WEEKS.length - 1, currentWeek + d));
  render();
}
function jumpWeek(i) { currentWeek = i; render(); }

// ─── CLOCK ───────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  const nz = new Date(utc + 12 * 3600000);
  const h = String(nz.getHours()).padStart(2,'0');
  const m = String(nz.getMinutes()).padStart(2,'0');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  document.getElementById('ticker-clock').textContent =
    `${days[nz.getDay()]} ${nz.getDate()} ${nz.toLocaleString('en-NZ',{month:'short'})} · ${h}:${m} NZST`;
}

// ─── AUTO-ADVANCE ─────────────────────────────────────────────────────────────
// Recalculate the correct week every 60 seconds in case the date ticks over
function autoAdvance() {
  const correct = getAutoWeek();
  if (correct !== currentWeek) { currentWeek = correct; render(); }
  updateClock();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
currentWeek = getAutoWeek();
render();
updateClock();
setInterval(autoAdvance, 60000);
</script>
