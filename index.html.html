*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c12;color:#e0e0e0;font-family:'Inter',sans-serif;min-height:100vh;padding:24px 28px 48px}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.hdr-left{display:flex;align-items:center;gap:16px}
.trophy{font-size:36px;line-height:1}
.hdr-title{font-size:24px;font-weight:600;color:#f5f5f5;letter-spacing:-0.3px}
.hdr-sub{font-size:11px;color:#555;margin-top:3px}
.nz-pill{display:inline-block;background:#0a2e16;border:1px solid #2daa55;color:#3ddb6a;font-size:11px;font-weight:500;padding:2px 9px;border-radius:20px;margin-left:8px;vertical-align:middle}
.nav{display:flex;align-items:center;gap:10px;background:#13161f;border:1px solid #22263a;border-radius:10px;padding:8px 14px}
.nav button{background:transparent;border:1px solid #2a2d3a;border-radius:6px;color:#aaa;font-size:15px;width:32px;height:32px;cursor:pointer;transition:background .15s}
.nav button:hover{background:#1e2130;color:#fff}
.nav button:disabled{opacity:.2;cursor:default}
.nav-center{text-align:center}
.nav-label{font-size:13px;font-weight:500;color:#ccc;min-width:190px}
.nav-dots{display:flex;gap:5px;justify-content:center;margin-top:5px}
.nav-dot{width:7px;height:7px;border-radius:50%;background:#2a2d3a;cursor:pointer;transition:background .15s}
.nav-dot.active{background:#e6b830}
.stage-badge{display:inline-block;font-size:11px;font-weight:500;padding:3px 11px;border-radius:6px;margin-bottom:12px;letter-spacing:.02em}
.s-gs{background:#0d2233;color:#5bc4f5;border:1px solid #1a4a6a}
.s-r32{background:#0d2b18;color:#5be89a;border:1px solid #1a5a35}
.s-r16{background:#2b1f00;color:#f5c842;border:1px solid #5a4000}
.s-qf{background:#2b1000;color:#f58c42;border:1px solid #5a2800}
.s-sf{background:#1a1040;color:#a894f5;border:1px solid #3a2880}
.s-fin{background:#2a1800;color:#f5c842;border:1px solid #6a4000}
.grid{display:grid;gap:8px}
.g7{grid-template-columns:repeat(7,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.day-col{background:#13161f;border:1px solid #1e2130;border-radius:10px;padding:10px 9px 12px;min-height:110px}
.day-col.today{border-color:#e6b830;box-shadow:0 0 0 1px #e6b83030}
.day-name{font-size:9px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.07em;margin-bottom:1px}
.day-date{font-size:14px;font-weight:500;color:#bbb;margin-bottom:9px}
.today .day-date{color:#e6b830}
.rest{font-size:10px;color:#252830;font-style:italic}
.match{border-left:2px solid #378ADD;padding:4px 0 4px 7px;margin-bottom:7px;border-radius:0 4px 4px 0}
.m-grp{border-left-color:#378ADD}
.m-r32{border-left-color:#3db87a}
.m-r16{border-left-color:#e6b830}
.m-qf{border-left-color:#e06830}
.m-sf{border-left-color:#9b82e8}
.m-fin{border-left-color:#e0a030;background:#1a1000;border-radius:0 6px 6px 0}
.m-nz{border-left:2px solid #3ddb6a!important;background:#061a0d;border-radius:0 6px 6px 0}
.grp-lbl{font-size:9px;color:#444;margin-bottom:2px}
.team-row{display:flex;align-items:center;gap:4px;line-height:1.55}
.team-flag{font-size:14px;line-height:1}
.team-name{font-size:11px;color:#ccc}
.nz-team .team-name{color:#3ddb6a;font-weight:600}
.vs{font-size:8px;color:#2a2d3a;padding-left:18px;line-height:1}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px;font-size:9px}
.meta .t{color:#4a6a7a}
.meta .v{color:#2d5070}
.tbc{font-size:10px;color:#2a2d3a;font-style:italic}
.final-lbl{font-size:12px;font-weight:600;color:#e6b830}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid #1a1e2a}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:#444}
.leg-dot{width:8px;height:8px;border-radius:50%}
.ticker{position:fixed;bottom:0;left:0;right:0;background:#0d1018;border-top:1px solid #1a1e2a;padding:7px 28px;font-size:11px;color:#444;display:flex;align-items:center;justify-content:space-between}
.t-nz{color:#3ddb6a;font-weight:500}
.t-clock{color:#3a4a5a}

// NZ matches for ticker
const NZ_MATCHES=[
 {d:"Tue 16 Jun",t1:"Iran",t2:"New Zealand",time:"1:00 PM",v:"Los Angeles"},
 {d:"Mon 22 Jun",t1:"Egypt",t2:"New Zealand",time:"1:00 PM",v:"Los Angeles"},
 {d:"Sat 27 Jun",t1:"New Zealand",t2:"Belgium",time:"1:00 PM",v:"Seattle"}
];

let wk=0;

function getNZToday(){
 const now=new Date();
 const utc=now.getTime()+now.getTimezoneOffset()*60000;
 const nz=new Date(utc+12*3600000);
 return nz.getFullYear()+"-"+String(nz.getMonth()+1).padStart(2,"0")+"-"+String(nz.getDate()).padStart(2,"0");
}

function getAutoWeek(){
 const today=getNZToday();
 let best=0;
 for(let i=0;i<W.length;i++){
  const days=W[i].days.map(d=>d.iso);
  if(days.includes(today))return i;
  if(W[i].days[0].iso<=today)best=i;
 }
 return best;
}

function renderMatch(m){
 if(m.fin)return`<div class="match m-fin"><div class="grp-lbl">${m.g}</div><div class="final-lbl">🏆 To be confirmed</div><div class="meta"><span class="t">⏰ ${m.time} NZST</span><span class="v">📍 ${m.v}</span></div></div>`;
 if(m.tbc){
  const ti=m.time?`<div class="meta"><span class="t">⏰ ${m.time} NZST</span>${m.v&&m.v!="TBC"?`<span class="v">📍 ${m.v}</span>`:""}</div>`:"";
  return`<div class="match ${m.c}"><div class="grp-lbl">${m.g}</div><div class="tbc">To be confirmed</div>${ti}</div>`;
 }
 const [f1,n1]=m.t[0],[f2,n2]=m.t[1];
 const nz1=n1==="New Zealand",nz2=n2==="New Zealand";
 return`<div class="match ${m.nz?"m-nz":m.c}">
  <div class="grp-lbl">${m.g}</div>
  <div class="team-row ${nz1?"nz-team":""}"><span class="team-flag">${f1}</span><span class="team-name">${n1}</span></div>
  <div class="vs">vs</div>
  <div class="team-row ${nz2?"nz-team":""}"><span class="team-flag">${f2}</span><span class="team-name">${n2}</span></div>
  <div class="meta"><span class="t">⏰ ${m.time} NZST</span><span class="v">📍 ${m.v}</span></div>
 </div>`;
}

function render(){
 const w=W[wk],today=getNZToday();
 document.getElementById("nav-label").textContent=w.label;
 document.getElementById("btn-prev").disabled=wk===0;
 document.getElementById("btn-next").disabled=wk===W.length-1;
 document.getElementById("nav-dots").innerHTML=W.map((_,i)=>`<div class="nav-dot ${i===wk?"active":""}" onclick="jumpWeek(${i})" title="${W[i].label}"></div>`).join("");
 const gc=w.cols===7?"g7":"g4";
 let h=`<span class="stage-badge ${w.sc}">${w.sl}</span><div class="grid ${gc}">`;
 for(const day of w.days){
  const isT=day.iso===today;
  h+=`<div class="day-col ${isT?"today":""}"><div class="day-name">${day.n}${isT?" · today":""}</div><div class="day-date">${day.d}</div>`;
  if(!day.m.length)h+=`<div class="rest">Rest day</div>`;
  for(const m of day.m)h+=renderMatch(m);
  h+=`</div>`;
 }
 h+=`</div>`;
 document.getElementById("content").innerHTML=h;

 // Ticker: next NZ match
 const todayMs=new Date(today).getTime();
 const nextNZ=NZ_MATCHES.find(m=>{
  const iso=W.flatMap(ww=>ww.days).find(dd=>dd.m.some(mm=>mm.nz&&mm.t&&(mm.t[0][1]===m.t1||mm.t[1][1]===m.t1)));
  return iso&&new Date(iso.iso).getTime()>=todayMs;
 });
 if(nextNZ)document.getElementById("t-nz").textContent=`🇳🇿 Next NZ: ${nextNZ.t1} vs ${nextNZ.t2} · ${nextNZ.d} · ${nextNZ.time} NZST · ${nextNZ.v}`;
 else document.getElementById("t-nz").textContent="🇳🇿 Group stage complete";
}

function changeWeek(d){wk=Math.max(0,Math.min(W.length-1,wk+d));render();}
function jumpWeek(i){wk=i;render();}

function clock(){
 const now=new Date(),utc=now.getTime()+now.getTimezoneOffset()*60000,nz=new Date(utc+12*3600000);
 const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
 const h=String(nz.getHours()).padStart(2,"0"),m=String(nz.getMinutes()).padStart(2,"0");
 document.getElementById("t-clock").textContent=`${days[nz.getDay()]} ${nz.getDate()} ${nz.toLocaleString("en-NZ",{month:"short"})} · ${h}:${m} NZST`;
}

function autoAdv(){const c=getAutoWeek();if(c!==wk){wk=c;render();}clock();}

wk=getAutoWeek();render();clock();
setInterval(autoAdv,60000);
</script>
